<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420">
  <title>Dhanush Pavan — ML Engineer, Cloud &amp; MLOps</title>
  <desc>Animated futuristic profile card featuring machine learning engineering, cloud and MLOps, and iron discipline.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#071326"/>
      <animate attributeName="x1" values="0;0.3;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#22D3EE;#60A5FA;#2563EB" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0EA5E9">
        <animate attributeName="stop-color" values="#0EA5E9;#60A5FA;#2563EB;#0EA5E9" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA;#2563EB;#22D3EE;#60A5FA" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6EDF3"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
      <animate attributeName="x1" values="0;0.5;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sheenGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#60A5FA" stop-opacity="0.025"/>
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#60A5FA" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
      <animate attributeName="cx" values="0.2;0.8;0.2" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0.1;0.9;0.1" dur="14s" repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="avatarGlow">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="75%" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="progressGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <pattern id="crystalPattern" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M21 0 L42 21 L21 42 L0 21 Z" fill="none" stroke="#60A5FA" stroke-opacity="0.055" stroke-width="0.7"/>
      <path d="M21 0 L21 42 M0 21 L42 21" stroke="#22D3EE" stroke-opacity="0.025" stroke-width="0.5"/>
      <circle cx="21" cy="21" r="1" fill="#60A5FA" fill-opacity="0.16"/>
    </pattern>

    <pattern id="microGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0 H0 V8" fill="none" stroke="#60A5FA" stroke-opacity="0.035" stroke-width="0.5"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="72" y="36" width="1056" height="348" rx="22"/>
    </clipPath>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="8"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
      }

      .mono {
        font-family: "Courier New", Courier, monospace;
      }

      .muted {
        fill: #94A3B8;
      }

      .bright {
        fill: #E6EDF3;
      }

      .label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2.2px;
      }

      .ability-title {
        font-size: 14px;
        font-weight: 700;
        fill: #E6EDF3;
      }

      .ability-subtitle {
        font-size: 10.5px;
        letter-spacing: 0.3px;
        fill: #94A3B8;
      }

      .score {
        font-family: "Courier New", Courier, monospace;
        font-size: 17px;
        font-weight: 700;
        fill: #BAE6FD;
      }

      .progress-track {
        fill: #17243A;
      }

      .progress-fill {
        fill: url(#progressGradient);
      }

      .tiny {
        font-family: "Courier New", Courier, monospace;
        font-size: 9px;
        letter-spacing: 1px;
        fill: #64748B;
      }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="420" fill="#050816"/>
  <rect width="1200" height="420" fill="url(#background)"/>

  <!-- Ambient background details -->
  <circle cx="160" cy="80" r="170" fill="#2563EB" opacity="0.055" filter="url(#softGlow)"/>
  <circle cx="1070" cy="350" r="180" fill="#0EA5E9" opacity="0.045" filter="url(#softGlow)"/>

  <g opacity="0.35">
    <path d="M0 90 H54 M0 96 H34 M1140 324 H1200 M1165 330 H1200" stroke="#2563EB" stroke-width="1"/>
    <path d="M42 0 V24 M48 0 V14 M1150 396 V420 M1156 406 V420" stroke="#22D3EE" stroke-width="1"/>
    <circle cx="46" cy="76" r="2" fill="#60A5FA"/>
    <circle cx="1150" cy="342" r="2" fill="#22D3EE"/>
  </g>

  <!-- Card shadow -->
  <rect x="72" y="36" width="1056" height="348" rx="22" fill="#2563EB" opacity="0.14" filter="url(#softGlow)"/>

  <!-- Main card -->
  <g filter="url(#cardShadow)">
    <rect x="72" y="36" width="1056" height="348" rx="22" fill="#0D1117" stroke="url(#borderGradient)" stroke-width="1.25"/>

    <g clip-path="url(#cardClip)">
      <!-- Card background -->
      <rect x="72" y="36" width="1056" height="348" fill="url(#ambientGlow)"/>
      <rect x="72" y="36" width="1056" height="348" fill="url(#crystalPattern)"/>
      <rect x="72" y="36" width="1056" height="348" fill="url(#microGrid)" opacity="0.4"/>

      <!-- Subtle top highlight -->
      <rect x="94" y="37" width="1012" height="1" fill="#BAE6FD" opacity="0.18"/>

      <!-- Animated diagonal sheen -->
      <g transform="skewX(-22)">
        <rect x="-400" y="20" width="250" height="390" fill="url(#sheenGradient)" opacity="0.8">
          <animate attributeName="x" values="-400;1450" dur="6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Left panel separator -->
      <path d="M446 64 V356" stroke="#1E293B" stroke-width="1"/>
      <path d="M446 64 V144" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.8"/>

      <!-- Decorative avatar glow -->
      <circle cx="170" cy="155" r="88" fill="url(#avatarGlow)"/>

      <!-- Avatar ring -->
      <circle cx="170" cy="155" r="63" fill="#0A1426" stroke="#1D4ED8" stroke-width="1.2"/>
      <circle cx="170" cy="155" r="57" fill="none" stroke="#22D3EE" stroke-opacity="0.65" stroke-width="0.8" stroke-dasharray="3 7">
        <animateTransform attributeName="transform" type="rotate" from="0 170 155" to="360 170 155" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="155" r="48" fill="#101D33" stroke="#2563EB" stroke-opacity="0.55" stroke-width="1"/>

      <!-- Monogram -->
      <text x="170" y="169" text-anchor="middle" font-size="39" font-weight="800" letter-spacing="-2" fill="url(#nameGradient)">DP</text>

      <!-- Small avatar indicators -->
      <circle cx="215" cy="112" r="4" fill="#22D3EE" filter="url(#blueGlow)"/>
      <circle cx="125" cy="197" r="3" fill="#2563EB"/>
      <path d="M170 82 V91 M170 219 V228 M97 155 H106 M234 155 H243" stroke="#60A5FA" stroke-opacity="0.7" stroke-width="1.2"/>

      <!-- Identity -->
      <text x="108" y="245" class="label" fill="#60A5FA">IDENTITY VERIFIED</text>

      <circle cx="112" cy="267" r="3.5" fill="#22D3EE" filter="url(#blueGlow)"/>
      <text x="124" y="271" font-size="11" fill="#BAE6FD" letter-spacing="1.2">AVAILABLE TO BUILD</text>

      <text x="108" y="302" class="mono" font-size="11" fill="#64748B">GITHUB /</text>
      <text x="108" y="320" class="mono" font-size="12" fill="#94A3B8">dhanushpavann</text>

      <path d="M108 337 H238" stroke="#1E293B" stroke-width="1"/>
      <text x="108" y="353" class="tiny">ENGINEER PROFILE // 001</text>

      <!-- Main heading -->
      <text x="486" y="83" class="label" fill="#60A5FA">PROFILE / ENGINEERING DIVISION</text>

      <text x="484" y="132" font-size="37" font-weight="800" letter-spacing="-1.1" fill="url(#nameGradient)">DHANUSH PAVAN</text>

      <text x="487" y="157" font-size="12" font-weight="700" letter-spacing="2" fill="#94A3B8">ML ENGINEER <tspan fill="#2563EB">·</tspan> CLOUD <tspan fill="#2563EB">·</tspan> MLOPS</text>

      <!-- HP indicator -->
      <g transform="translate(1005 84)">
        <text x="0" y="0" text-anchor="end" class="label" fill="#64748B">HP</text>
        <text x="0" y="25" text-anchor="end" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#BAE6FD">999</text>
        <rect x="-54" y="35" width="54" height="2" rx="1" fill="#1E293B"/>
        <rect x="-54" y="35" width="54" height="2" rx="1" fill="url(#progressGradient)"/>
      </g>

      <!-- Edition stamp -->
      <g transform="translate(1064 86)">
        <circle cx="0" cy="0" r="21" fill="#0B172A" stroke="#2563EB" stroke-width="1"/>
        <circle cx="0" cy="0" r="16" fill="none" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="0.8" stroke-dasharray="2 3"/>
        <text x="0" y="-2" text-anchor="middle" font-size="8" font-weight="800" letter-spacing="0.8" fill="#BAE6FD">APEX</text>
        <text x="0" y="7" text-anchor="middle" font-size="5.5" font-weight="700" letter-spacing="0.6" fill="#60A5FA">CLASS</text>
      </g>

      <!-- Ability 1 -->
      <g transform="translate(486 181)">
        <rect x="0" y="0" width="4" height="37" rx="2" fill="#2563EB"/>
        <text x="17" y="13" class="ability-title">◈  ML Systems Engineering</text>
        <text x="17" y="30" class="ability-subtitle">machine learning · deployment · pipelines</text>

        <text x="596" y="13" text-anchor="end" class="score">96</text>
        <text x="596" y="29" text-anchor="end" class="tiny">RANK</text>

        <rect x="17" y="43" width="579" height="3" rx="1.5" class="progress-track"/>
        <rect x="17" y="43" width="556" height="3" rx="1.5" class="progress-fill">
          <animate attributeName="width" values="0;556" dur="1.5s" begin="0.2s" fill="freeze"/>
        </rect>
      </g>

      <!-- Ability 2 -->
      <g transform="translate(486 244)">
        <rect x="0" y="0" width="4" height="37" rx="2" fill="#0EA5E9"/>
        <text x="17" y="13" class="ability-title">◇  Cloud &amp; MLOps</text>
        <text x="17" y="30" class="ability-subtitle">infrastructure · automation · scalability</text>

        <text x="596" y="13" text-anchor="end" class="score">94</text>
        <text x="596" y="29" text-anchor="end" class="tiny">RANK</text>

        <rect x="17" y="43" width="579" height="3" rx="1.5" class="progress-track"/>
        <rect x="17" y="43" width="544" height="3" rx="1.5" class="progress-fill">
          <animate attributeName="width" values="0;544" dur="1.5s" begin="0.45s" fill="freeze"/>
        </rect>
      </g>

      <!-- Ability 3 -->
      <g transform="translate(486 307)">
        <rect x="0" y="0" width="4" height="29" rx="2" fill="#22D3EE"/>
        <text x="17" y="12" class="ability-title">⚡  Iron Discipline</text>
        <text x="17" y="28" class="ability-subtitle">strength training · swimming · consistency</text>

        <text x="596" y="13" text-anchor="end" class="score">95</text>
        <text x="596" y="27" text-anchor="end" class="tiny">RANK</text>
      </g>

      <!-- Footer separator -->
      <path d="M474 350 H1092" stroke="#1E293B" stroke-width="1"/>

      <!-- Footer -->
      <text x="486" y="368" class="tiny">APEX CLASS <tspan fill="#2563EB">/</tspan> 001</text>
      <text x="1092" y="368" text-anchor="end" class="tiny">BUILT DIFFERENT <tspan fill="#22D3EE">◆</tspan> STAY CONSISTENT</text>
    </g>
  </g>

  <!-- Outer corner markers -->
  <g fill="none" stroke="#2563EB" stroke-width="1.2" opacity="0.8">
    <path d="M57 60 V45 Q57 29 73 29 H98"/>
    <path d="M1102 29 H1127 Q1143 29 1143 45 V60"/>
    <path d="M57 360 V375 Q57 391 73 391 H98"/>
    <path d="M1102 391 H1127 Q1143 391 1143 375 V360"/>
  </g>

  <g fill="#22D3EE">
    <circle cx="57" cy="60" r="2"/>
    <circle cx="1143" cy="60" r="2"/>
    <circle cx="57" cy="360" r="2"/>
    <circle cx="1143" cy="360" r="2"/>
  </g>
</svg>
